<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FFT | {{ page.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="Fethi Fırat Tülü">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Fethi Fırat Tülü | {{ page.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/fft_pic.jpg">

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;700&family=Tinos&display=swap">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>

  <body>
    {% include header.html %}

    <main class="Content">
{{ content }}
    </main>

    {% include footer.html %}
